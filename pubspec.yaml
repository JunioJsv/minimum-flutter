name: minimum
description: "Android app launcher"
publish_to: 'none'

version: 3.0.0+157

environment:
  sdk: '^3.13.5'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  slang: ^4.12.1
  slang_flutter: ^4.12.1
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  path_provider: ^2.1.5
  json_annotation: ^4.11.0
  dynamic_color: ^1.9.0
  collection: 1.19.1
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  fast_immutable_collections: ^11.1.0
  android_intent_plus: ^6.0.0
  transparent_image: 2.0.1
  sentry_flutter: ^9.28.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  slang_build_runner: ^4.12.1
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true
